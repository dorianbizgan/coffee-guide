<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew Guide</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }
  .header {
    background: #1a1a1a;
    color: white;
    padding: 20px 24px;
  }
  .roaster {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #999;
    margin-bottom: 4px;
  }
  .coffee-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 12px;
    color: #888;
    margin-top: 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  tr {
    border-bottom: 1px solid #f0f0f0;
  }
  tr:last-child {
    border-bottom: none;
  }
  td {
    padding: 14px 24px;
    font-size: 14px;
  }
  td:first-child {
    color: #888;
    width: 60%;
  }
  td:last-child {
    font-weight: 600;
    color: #1a1a1a;
    text-align: right;
  }
  tr:nth-child(even) {
    background: #fafafa;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="roaster">Camber Coffee</div>
    <div class="coffee-name">Colombia La Despensa</div>
    <div class="subtitle">Chiroso · Washed · 1950–2200 masl · Urrao, Antioquia</div>
  </div>
  <table>
    <tr>
      <td>Grind Size (Acaia Orbit SSP Lab Sweet V3)</td>
      <td>1.2</td>
    </tr>
    <tr>
      <td>Brew Temperature</td>
      <td>207°F</td>
    </tr>
    <tr>
      <td>Dose</td>
      <td>18g</td>
    </tr>
    <tr>
      <td>Yield</td>
      <td>48–50g</td>
    </tr>
    <tr>
      <td>Pressure</td>
      <td>8 bar</td>
    </tr>
    <tr>
      <td>Preinfusion</td>
      <td>10s @ 2–3 bar</td>
    </tr>
    <tr>
      <td>Total Shot Time</td>
      <td>38–42s</td>
    </tr>
    <tr>
      <td>Basket</td>
      <td>IMS 18g Precision High-Flow</td>
    </tr>
  </table>
</div>
</body>
</html>
