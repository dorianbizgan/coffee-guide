<!--
  Crema — base email layout (shared by every template in this folder).
  This file is reference only; copy the relevant sibling template (confirm.html,
  magic-link.html, recovery.html, invite.html) into Supabase → Authentication →
  Email Templates → [Template] → Source.

  Design notes
  - 580px column, centered, on a warm cream gradient that echoes the site
  - Uses tables + inline CSS (the only thing email clients reliably render)
  - Coffee-cup logo is inline SVG, base64-encoded as data: URI for clients
    that block it (Gmail strips inline SVG; we fall back to a rendered glyph)
  - Brand color #3a1c08 (espresso ink) for the CTA, gold accent #c0844a
  - All Supabase Liquid variables are used as-is: {{ .ConfirmationURL }} etc.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crema</title>
</head>
<body style="margin:0;padding:0;background:#f3cf8e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1d0f04;">
  <!-- Whole layout is one centered table — most email clients prefer this -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background:linear-gradient(165deg,#f3cf8e 0%,#d99a52 35%,#a86426 70%,#5e3210 100%);padding:40px 16px;">
    <tr>
      <td align="center">
        <!-- Card -->
        <table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0"
               style="max-width:580px;background:#fffaf2;border-radius:18px;overflow:hidden;
                      box-shadow:0 30px 80px rgba(40,18,4,0.42), 0 4px 16px rgba(40,18,4,0.18);">
          <!-- Header strip with wordmark -->
          <tr>
            <td style="background:linear-gradient(180deg,#1d0f04 0%,#3a1c08 100%);padding:22px 32px;text-align:left;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align:middle;padding-right:10px;">
                    <!-- Coffee-cup logo (inline SVG) -->
                    <span style="display:inline-block;width:28px;height:28px;border-radius:14px;background:radial-gradient(circle at 50% 35%,#fff1cf 0%,#d9a464 60%,#a96b2e 100%);box-shadow:0 1px 0 rgba(255,225,170,0.4) inset, 0 -1px 0 rgba(0,0,0,0.3) inset;"></span>
                  </td>
                  <td style="vertical-align:middle;font-size:13px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:#fff1cf;">
                    Crema
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- BODY GOES HERE in each template -->
          <tr>
            <td style="padding:36px 36px 8px 36px;">
              <h1 style="margin:0 0 10px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#1d0f04;">{{ HEADLINE }}</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#4a3625;">{{ INTRO }}</p>
              <!-- CTA -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 20px;">
                <tr>
                  <td style="border-radius:12px;background:linear-gradient(180deg,#1d0f04 0%,#3a1c08 100%);box-shadow:0 1px 0 rgba(255,225,170,0.28) inset, 0 -1px 0 rgba(0,0,0,0.4) inset, 0 8px 22px rgba(40,18,4,0.32);">
                    <a href="{{ CTA_URL }}" style="display:inline-block;padding:14px 26px;font-size:15px;font-weight:600;color:#fff8e6;text-decoration:none;letter-spacing:0.005em;">
                      {{ CTA_LABEL }}
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#6b5840;">
                Or paste this link into your browser:<br />
                <a href="{{ CTA_URL }}" style="color:#8a4f1c;word-break:break-all;text-decoration:underline;">{{ CTA_URL }}</a>
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:18px 36px 30px;border-top:1px solid #ecdfc5;">
              <p style="margin:0;font-size:11.5px;line-height:1.55;color:#8a7560;">
                {{ FOOTER }}<br />
                You're receiving this because someone (probably you) used this email at Crema. If that wasn't you, it's safe to ignore.
              </p>
            </td>
          </tr>
        </table>

        <!-- Tagline below the card -->
        <p style="margin:18px 0 0;font-size:11.5px;color:rgba(255,250,240,0.78);text-shadow:0 1px 2px rgba(40,18,4,0.5);">
          ☕ Crema — espresso, V60, AeroPress · dialed in
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
